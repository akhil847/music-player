<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Echo — Music Player</title>
  <meta name="description" content="Echo: an ad-free personal music player with trending music, groups, and your own files." />
  <meta name="theme-color" content="#0d0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Echo" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

    <symbol id="i-link" viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></symbol>

    <symbol id="i-speed" viewBox="0 0 24 24"><path d="M20.38 8.57l-1.23 1.85a8 8 0 01-.22 7.58H5.07A8 8 0 0115.58 6.85l1.85-1.23A10 10 0 003.35 19a2 2 0 001.72 1h13.85a2 2 0 001.74-1 10 10 0 00-.27-10.44zm-9.79 6.84a2 2 0 002.83 0l5.66-8.49-8.49 5.66a2 2 0 000 2.83z"/></symbol>
  </svg>

  <div id="app" class="app">
    <aside class="sidebar">
      <a class="brand" href="#/home">
        <span class="brand-logo"><svg class="i"><use href="#i-music"/></svg></span>
        <span class="brand-name">Echo</span>
      </a>
      <nav class="side-nav">
        <a href="#/home" data-nav="home"><svg class="i"><use href="#i-home"/></svg><span>Home</span></a>
        <a href="#/search" data-nav="search"><svg class="i"><use href="#i-search"/></svg><span>Search</span></a>
        <a href="#/trending" data-nav="trending"><svg class="i"><use href="#i-fire"/></svg><span>Trending</span></a>
        <a href="#/library" data-nav="library"><svg class="i"><use href="#i-library"/></svg><span>Library</span></a>
        <a href="#/settings" data-nav="settings"><svg class="i"><use href="#i-settings"/></svg><span>Settings</span></a>
      </nav>
      <div class="side-section">
        <div class="side-head">
          <span>Your groups</span>
          <button class="icon-btn sm" data-action="new-group" title="New group"><svg class="i"><use href="#i-plus"/></svg></button>
        </div>
        <div id="sideGroups" class="side-groups"></div>
      </div>
    </aside>

    <main id="view" class="view" tabindex="-1"></main>

    <!-- Player bar (desktop) / mini player (mobile) -->
    <footer id="playerBar" class="player-bar is-empty">
      <div class="pb-track" data-action="open-now-playing">
        <div class="pb-art art"></div>
        <div class="pb-meta">
          <div class="pb-title">Nothing playing</div>
          <div class="pb-artist">Pick a song to start</div>
        </div>
        <button class="icon-btn pb-like" data-action="like-current" title="Like"><svg class="i"><use href="#i-heart"/></svg></button>
      </div>
      <div class="pb-center">
        <div class="pb-controls">
          <button class="icon-btn hide-mobile" data-action="shuffle" title="Shuffle (S)"><svg class="i"><use href="#i-shuffle"/></svg></button>
          <button class="icon-btn hide-mobile" data-action="prev" title="Previous"><svg class="i"><use href="#i-prev"/></svg></button>
          <button class="play-btn" data-action="toggle" title="Play/Pause (Space)"><svg class="i"><use href="#i-play"/></svg></button>
          <button class="icon-btn" data-action="next" title="Next"><svg class="i"><use href="#i-next"/></svg></button>
          <button class="icon-btn hide-mobile" data-action="repeat" title="Repeat (R)"><svg class="i"><use href="#i-repeat"/></svg></button>
        </div>
        <div class="pb-progress hide-mobile">
          <span class="time cur">0:00</span>
          <input type="range" class="seek" min="0" max="1000" value="0" step="1" aria-label="Seek" />
          <span class="time dur">0:00</span>
        </div>
      </div>
      <div class="pb-right hide-mobile">
        <button class="icon-btn" data-action="open-queue" title="Queue"><svg class="i"><use href="#i-queue"/></svg></button>
        <button class="icon-btn" data-action="mute" title="Mute (M)"><svg class="i vol-icon"><use href="#i-volume"/></svg></button>
        <input type="range" class="volume" min="0" max="100" value="100" aria-label="Volume" />
      </div>
      <div class="mini-progress"><div></div></div>
    </footer>

    <nav class="bottom-nav">
      <a href="#/home" data-nav="home"><svg class="i"><use href="#i-home"/></svg><span>Home</span></a>
      <a href="#/search" data-nav="search"><svg class="i"><use href="#i-search"/></svg><span>Search</span></a>
      <a href="#/trending" data-nav="trending"><svg class="i"><use href="#i-fire"/></svg><span>Trending</span></a>
      <a href="#/library" data-nav="library"><svg class="i"><use href="#i-library"/></svg><span>Library</span></a>
      <a href="#/settings" data-nav="settings"><svg class="i"><use href="#i-settings"/></svg><span>Settings</span></a>
    </nav>
  </div>

  <!-- Full-screen now playing -->
  <section id="nowPlaying" class="now-playing" aria-hidden="true">
    <div class="np-bg"></div>
    <div class="np-inner">
      <header class="np-head">
        <button class="icon-btn" data-action="close-now-playing" title="Close"><svg class="i"><use href="#i-down"/></svg></button>
        <button class="np-context" data-action="open-context">Now playing</button>
        <button class="icon-btn" data-action="current-menu" title="More"><svg class="i"><use href="#i-more"/></svg></button>
      </header>
      <div class="np-art art"></div>
      <div class="np-meta">
        <div class="np-text">
          <div class="np-title">Nothing playing</div>
          <div class="np-artist"></div>
        </div>
        <button class="icon-btn np-like" data-action="like-current" title="Like"><svg class="i"><use href="#i-heart"/></svg></button>
      </div>
      <div class="np-progress">
        <input type="range" class="seek" min="0" max="1000" value="0" step="1" aria-label="Seek" />
        <div class="np-times"><span class="time cur">0:00</span><span class="time dur">0:00</span></div>
      </div>
      <div class="np-controls">
        <button class="icon-btn" data-action="shuffle" title="Shuffle"><svg class="i"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn lg" data-action="prev" title="Previous"><svg class="i"><use href="#i-prev"/></svg></button>
        <button class="play-btn xl" data-action="toggle" title="Play/Pause"><svg class="i"><use href="#i-play"/></svg></button>
        <button class="icon-btn lg" data-action="next" title="Next"><svg class="i"><use href="#i-next"/></svg></button>
        <button class="icon-btn" data-action="repeat" title="Repeat"><svg class="i"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="np-extras">
        <button class="chip-btn" data-action="sleep-timer"><svg class="i"><use href="#i-timer"/></svg><span class="sleep-label">Sleep</span></button>
        <button class="chip-btn" data-action="speed"><svg class="i"><use href="#i-speed"/></svg><span class="speed-label">1×</span></button>
        <button class="chip-btn" data-action="open-queue"><svg class="i"><use href="#i-queue"/></svg><span>Queue</span></button>
      </div>
    </div>
  </section>

  <div id="sheetRoot" class="sheet-root" aria-hidden="true">
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.opus,.webm" multiple hidden />
  <input type="file" id="importInput" accept="application/json,.json" hidden />
  <audio id="audio" preload="auto" playsinline></audio>

  <script type="module" src="js/app.js"></script>
</body>
</html>
